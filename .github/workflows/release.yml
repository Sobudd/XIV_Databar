name: Create new version

on:
  push:
    branches: ['main', 'beta', 'alpha']
permissions:
  contents: write
  packages: write

jobs:
  luacheck:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Luacheck
        continue-on-error: true
        uses: nebularg/actions-luacheck@v1

  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git user
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Determine latest tag and next version
        id: version
        run: |
          git fetch --tags
          latest_tag=$(git tag --list 'XIV_Databar-*' --sort=-v:refname | head -n 1)
          if [ -n "$latest_tag" ]; then
            current_version=${latest_tag#XIV_Databar-}
          else
            current_version="3.2.6"
          fi
          echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT
          echo "current_version=$current_version" >> $GITHUB_OUTPUT
          IFS='.' read -r major minor patch <<< "$current_version"
          patch=$((patch + 1))
          next_version="$major.$minor.$patch"
          echo "version=$next_version" >> $GITHUB_OUTPUT

      - name: Exit if no new commits since last release
        id: has_changes
        run: |
          if [ -n "${{ steps.version.outputs.latest_tag }}" ]; then
            commit_count=$(git rev-list --count "${{ steps.version.outputs.latest_tag }}"..HEAD)
          else
            commit_count=$(git rev-list --count HEAD)
          fi
          echo "commit_count=$commit_count" >> $GITHUB_OUTPUT
          if [ "$commit_count" -eq 0 ]; then
            echo "No commits since last release. Exiting without release."
            exit 0
          fi

      - name: Build release notes
        run: |
          if [ -n "${{ steps.version.outputs.latest_tag }}" ]; then
            git log --pretty=format:'- %s' "${{ steps.version.outputs.latest_tag }}"..HEAD > release-notes.txt
          else
            git log --pretty=format:'- %s' HEAD > release-notes.txt
          fi

      - name: Update CHANGELOG.md
        run: |
          release_date=$(date +'%d/%m/%y')
          version="${{ steps.version.outputs.version }}"
          python3 scripts/update_changelog.py "$version" "$release_date"
          git add CHANGELOG.md
          git commit -m "chore(release): $version [skip ci]"

      - name: Create release tag and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "XIV_Databar-${{ steps.version.outputs.version }}"
          git push origin HEAD --follow-tags
